<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17"/>
      <stop offset="50%" stop-color="#121728"/>
      <stop offset="100%" stop-color="#080a10"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Hex/Rounded Shield -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="url(#neonCyan)" stroke-width="6"/>

  <!-- Subtle Cyber Grid Lines inside icon -->
  <path d="M 64 256 L 448 256 M 256 64 L 256 448" stroke="rgba(0, 240, 255, 0.08)" stroke-width="2"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(168, 85, 247, 0.12)" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Controller Silhouette with Glowing Stroke -->
  <g filter="url(#glow)">
    <!-- Controller Body -->
    <path d="M 160 170 C 190 160 322 160 352 170 C 385 182 430 250 410 330 C 395 385 345 380 320 340 C 295 300 217 300 192 340 C 167 380 117 385 102 330 C 82 250 127 182 160 170 Z"
          fill="#161d2f" stroke="url(#neonCyan)" stroke-width="8" stroke-linejoin="round"/>

    <!-- Controller D-Pad -->
    <path d="M 160 215 L 175 215 L 175 230 L 190 230 L 190 245 L 175 245 L 175 260 L 160 260 L 160 245 L 145 245 L 145 230 L 160 230 Z"
          fill="url(#neonCyan)"/>

    <!-- Action Buttons (Triangle, Square, Circle, Cross aesthetic) -->
    <circle cx="340" cy="222" r="7" fill="#00ff88"/>
    <circle cx="322" cy="237" r="7" fill="#ff4d8d"/>
    <circle cx="358" cy="237" r="7" fill="#00f0ff"/>
    <circle cx="340" cy="252" r="7" fill="#a855f7"/>

    <!-- Thumbsticks -->
    <circle cx="205" cy="275" r="22" fill="#0e1320" stroke="url(#neonPurple)" stroke-width="5"/>
    <circle cx="205" cy="275" r="9" fill="url(#neonCyan)"/>

    <circle cx="307" cy="275" r="22" fill="#0e1320" stroke="url(#neonPurple)" stroke-width="5"/>
    <circle cx="307" cy="275" r="9" fill="url(#neonCyan)"/>

    <!-- Center Light Bar -->
    <rect x="236" y="195" width="40" height="8" rx="4" fill="url(#neonCyan)"/>
  </g>

  <!-- "TGA" Modern Text Badge at Bottom -->
  <text x="256" y="440" font-family="'Segoe UI', Roboto, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="8" text-anchor="middle">
    T<tspan fill="#00f0ff">G</tspan><tspan fill="#c084fc">A</tspan>
  </text>
</svg>
